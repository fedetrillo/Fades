<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Fades</title>
  <style>
    :root, [data-theme="dark"] {
      --plate: #141619; --panel: #1d2024; --panel2: #24282d; --well: #101215; --edge: #2c3036;
      --text: #f1f0ec; --dim: #858a93; --silk: #b9bdc5; --acc: #2ee6a6; --acc2: #9be14a; --ink: #0d1a15;
      --cin: #2ee6a6; --cxf: #3fd5d2; --cout: #4cc3ff;
      --ok: #3ddc84; --bad: #ff5a6a; color-scheme: dark;
    }
    [data-theme="grey"] {
      --plate: #4a4e55; --panel: #555a62; --panel2: #5d626a; --well: #41454b; --edge: #6a6f78;
      --text: #f6f5f1; --dim: #c9ccd1; --silk: #e1e3e6; --acc: #5ff0bd; --acc2: #b8ee7a; --ink: #0d1a15;
      --cin: #5ff0bd; --cxf: #6fe6e3; --cout: #7fd4ff;
      --ok: #7ef0ae; --bad: #ff9aa3;
    }
    [data-color="yellow"] { --acc: #ffd23f; --acc2: #f5a623; --ink: #1f1600; }
    [data-color="orange"] { --acc: #ffa94d; --acc2: #ff6b3d; --ink: #1f0c00; }
    [data-color="red"]    { --acc: #ff6b6b; --acc2: #e0334f; --ink: #1f0508; }
    [data-color="green"]  { --acc: #2ee6a6; --acc2: #9be14a; --ink: #0b1a10; }
    [data-color="blue"]   { --acc: #4cc3ff; --acc2: #5b6cff; --ink: #06131f; }
    [data-color="pink"]   { --acc: #ff86c8; --acc2: #ff4f8b; --ink: #1f0612; }
    [data-color="purple"] { --acc: #c08bff; --acc2: #7b5cff; --ink: #12081f; }
    [data-theme="grey"][data-color="yellow"] { --acc: #ffdc66; --acc2: #ffb648; }
    [data-theme="grey"][data-color="orange"] { --acc: #ffbd73; --acc2: #ff8a63; }
    [data-theme="grey"][data-color="red"]    { --acc: #ff8f8f; --acc2: #ff5c74; }
    [data-theme="grey"][data-color="green"]  { --acc: #5ff0bd; --acc2: #b8ee7a; }
    [data-theme="grey"][data-color="blue"]   { --acc: #7fd4ff; --acc2: #8f9bff; }
    [data-theme="grey"][data-color="pink"]   { --acc: #ffa6d6; --acc2: #ff79a8; }
    [data-theme="grey"][data-color="purple"] { --acc: #d4adff; --acc2: #a08bff; }
    .colors { position: relative; }
    #colorBtn { width: 30px; height: 28px; border-radius: 9px; border: 1px solid var(--edge); background: var(--well); display: grid; place-items: center; padding: 0; }
    #colorBtn i, .sw { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, var(--acc), var(--acc2)); display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
    #colorBtn.open { border-color: var(--acc); }
    .menu { position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; width: 150px; padding: 5px; background: var(--panel2); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; }
    .menu[hidden] { display: none; }
    .menu button { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 5px 8px; border-radius: 7px; font-weight: 700; font-size: 12px; text-align: left; }
    .menu button:hover { background: var(--well); }
    .menu button span { flex: 1; }
    .menu button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
    .menu button.on svg { visibility: visible; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--plate); color: var(--text); font: 12.5px/1.35 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-font-smoothing: antialiased; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    svg { display: block; }

    /* Top bar: presets, factory default, compare */
    .top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--edge); min-width: 0; }
    body { overflow-x: hidden; }
    h1 { white-space: nowrap; margin: 0 8px 0 0; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
    h1 small { font-weight: 600; color: var(--dim); font-size: 10.5px; margin-left: 4px; }
    .lbl { color: var(--dim); font-size: 11px; font-weight: 700; }
    .slots { display: flex; gap: 3px; }
    .slot { width: 26px; height: 24px; border-radius: 7px; border: 1px solid var(--edge); background: var(--well); font-weight: 800; font-size: 12px; color: var(--silk); padding: 0; }
    .slot:hover { border-color: var(--silk); color: var(--text); }
    .slot.on { background: linear-gradient(135deg, var(--acc), var(--acc2)); border: 0; color: var(--ink); }
    #preset { min-width: 150px; max-width: 190px; padding: 4px 8px; font-weight: 700; border-radius: 9px; }
    .savebox { display: inline-flex; gap: 5px; align-items: center; }
    .savebox[hidden] { display: none; }
    #saveName { width: 120px; background: var(--well); border: 1px solid var(--acc); border-radius: 8px; padding: 3px 8px; font-weight: 700; outline: none; }
    .btn.mainsm { background: var(--acc); border-color: var(--acc); color: var(--ink); }
    .btn { border: 1px solid var(--edge); background: var(--well); border-radius: 8px; padding: 4px 11px; font-weight: 700; font-size: 12px; }
    .btn:hover { border-color: var(--silk); }
    .btn.on { border-color: var(--acc); color: var(--acc); }
    .btn:disabled { opacity: .4; cursor: default; }
    .grow { flex: 1; }
    .theme { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 2px; }
    .theme button { width: 26px; height: 22px; border: 0; border-radius: 7px; background: none; display: grid; place-items: center; padding: 0; color: var(--dim); }
    .theme button.on { background: var(--panel2); color: var(--text); }
    .theme svg { width: 12px; height: 12px; }
    select { background: var(--well); border: 1px solid var(--edge); border-radius: 8px; padding: 3px 6px; font-size: 12px; }

    main { flex: 1; overflow: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
    /* The strip: clips A and B with all three fades, draggable */
    .stripbox { background: var(--panel); border-radius: 16px; padding: 6px 8px; }
    #strip { width: 100%; height: 92px; overflow: visible; }
    #strip .clip { stroke: none; }
    #strip .clip.a { fill: color-mix(in srgb, var(--cin) 10%, var(--panel2)); }
    #strip .clip.b { fill: color-mix(in srgb, var(--cout) 10%, var(--panel2)); opacity: .95; }
    #strip .cl { fill: var(--dim); font-size: 12px; font-weight: 800; }
    #strip .fill.in { fill: color-mix(in srgb, var(--cin) 32%, transparent); }
    #strip .fill.out { fill: color-mix(in srgb, var(--cout) 32%, transparent); }
    #strip .fill.x { fill: color-mix(in srgb, var(--cxf) 22%, transparent); }
    #strip .curve { fill: none; stroke-width: 2.6; stroke-linecap: round; }
    #strip .curve.in { stroke: var(--cin); }
    #strip .curve.out { stroke: var(--cout); }
    #strip .curve.x { stroke: var(--cxf); }
    #strip .curve.x2 { stroke: var(--cxf); opacity: .6; }
    #strip .hot { fill: transparent; cursor: pointer; }
    #strip .zone.off { opacity: .25; }
    #strip .cut { stroke: var(--text); stroke-width: 1.4; stroke-dasharray: 3 4; opacity: .55; }
    #strip .handle { cursor: ew-resize; }
    #strip .handle line { stroke: var(--text); stroke-width: 1.2; opacity: .5; }
    #strip .handle circle { fill: var(--text); stroke: var(--plate); stroke-width: 2; }
    #strip .handle:hover circle { fill: var(--acc); }
    #strip .handle.off { display: none; }
    #strip .ms.fin { fill: var(--cin); } #strip .ms.xf { fill: var(--cxf); } #strip .ms.fout { fill: var(--cout); }
    #strip .ms { fill: var(--silk); font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; }
    /* Three cards */
    #cards { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 10px; }
    .card3.fin { --c: var(--cin); } .card3.xf { --c: var(--cxf); } .card3.fout { --c: var(--cout); }
    .card3 { background: var(--panel); border-radius: 16px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 9px; border: 1.5px solid transparent; border-top: 3px solid var(--c); transition: border-color .15s; min-width: 0; }
    .card3.focus { border-color: color-mix(in srgb, var(--c) 55%, transparent); border-top-color: var(--c); }
    .card3.off { --c: var(--edge); }
    .card3.off header b { color: var(--dim); }
    .card3 header { display: flex; align-items: center; gap: 8px; }
    .card3 header b { flex: 1; font-size: 13px; font-weight: 800; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
    .num { display: flex; align-items: center; gap: 3px; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 3px 8px; width: 92px; }
    .num input { width: 100%; border: 0; background: none; text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 14px; color: var(--c); outline: none; }
    .num span { color: var(--dim); font-size: 11px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .fl { color: var(--dim); font-size: 10.5px; font-weight: 700; }
    .seg { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 10px; padding: 2px; }
    .seg button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 4px 4px; font-size: 11px; font-weight: 700; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
    .seg button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .seg button svg { width: 24px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .seg button .pf { fill: currentColor; stroke: none; opacity: .5; }
    .seg button .pc { stroke: currentColor; stroke-width: 1.4; stroke-dasharray: 2 2; }
    .seg button.on { background: var(--panel2); color: var(--text); }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .tog { border: 1px solid var(--edge); background: var(--well); border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 700; color: var(--dim); }
    .tog.on { background: color-mix(in srgb, var(--c) 18%, var(--well)); border-color: color-mix(in srgb, var(--c) 60%, transparent); color: var(--text); }
    .foot { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--edge); }
    /* What is selected, and what Apply will do */
    .tbar { display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: 14px; padding: 7px 14px; border: 1.5px solid transparent; }
    .tbar.ready { border-color: color-mix(in srgb, var(--acc) 45%, transparent); }
    .tic { width: 34px; height: 34px; border-radius: 10px; background: var(--well); display: grid; place-items: center; flex: none; color: var(--dim); }
    .tbar.ready .tic { background: color-mix(in srgb, var(--acc) 16%, var(--well)); color: var(--acc); }
    .tic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .who { min-width: 0; }
    #tMain, #sMain { display: block; font-size: 14px; font-weight: 800; }
    #tSub, #sSub { display: block; color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sum { display: flex; gap: 6px; margin-left: auto; flex: none; }
    .pill { display: flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-weight: 800; font-size: 12px; background: var(--well); border: 1px solid var(--edge); font-variant-numeric: tabular-nums; }
    .pill i { width: 9px; height: 9px; border-radius: 50%; }
    .pill em { font-style: normal; color: var(--dim); font-weight: 700; }
    .pill.zero { opacity: .45; }
    .pill.fin i { background: var(--cin); } .pill.xf i { background: var(--cxf); } .pill.fout i { background: var(--cout); }
    .mode { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .mode .seg { flex: none; }
    .mode .seg button { flex-direction: row; padding: 5px 11px; font-size: 11.5px; white-space: nowrap; flex: none; }
    .link { border: 0; background: none; color: var(--dim); font-size: 11px; font-weight: 700; text-decoration: underline dotted; padding: 0; }
    .link.on { color: var(--acc); }
    .rule { color: var(--dim); font-size: 11.5px; }
    .status { font-size: 12px; color: var(--dim); }
    .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
    .btn.main { background: linear-gradient(90deg, var(--acc), var(--acc2)); border: 0; color: var(--ink); font-weight: 800; padding: 7px 22px; font-size: 13px; }

    /* Tabs: Fades | Strip silence */
    .tabs { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 10px; padding: 2px; flex: none; }
    .tabs button { border: 0; background: none; border-radius: 8px; padding: 4px 9px; font-weight: 800; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .tabs button svg { width: 15px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .tabs button.on { background: var(--panel2); color: var(--text); }
    .tabs .new { font-size: 9px; font-weight: 900; background: var(--acc); color: var(--ink); border-radius: 5px; padding: 1px 4px; }
    body[data-tab="fades"] .sOnly, body[data-tab="strip"] .fOnly { display: none !important; }
    /* Strip silence */
    :root { --cthr: #ffd23f; --ccut: #ff6b6b; }
    [data-theme="grey"] { --cthr: #ffe27a; --ccut: #ff9a9a; }
    .pill.cut i { background: var(--ccut); }
    .wavebox { background: var(--panel); border-radius: 16px; padding: 7px 10px 6px; }
    .whead { display: flex; align-items: center; gap: 10px; margin: 0 2px 4px; min-width: 0; }
    .whead select { font-weight: 800; max-width: 170px; }
    .whead .fl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lg { display: flex; gap: 12px; color: var(--dim); font-size: 10.5px; font-weight: 700; flex: none; }
    .lg span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .lg i { width: 12px; height: 8px; border-radius: 2px; display: block; }
    .lg .thr { background: var(--cthr); } .lg .cutk { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--ccut) 60%, transparent) 0 3px, transparent 3px 6px); border: 1px solid var(--ccut); }
    .lg .pad { background: color-mix(in srgb, var(--silk) 30%, transparent); } .lg .fd { background: var(--cin); }
    #wave { width: 100%; height: 132px; }
    #wave .wv { stroke: var(--dim); stroke-width: 1; opacity: .45; }
    #wave .wk { stroke: var(--silk); stroke-width: 1; }
    #wave .keep { fill: color-mix(in srgb, var(--acc) 9%, var(--panel2)); stroke: color-mix(in srgb, var(--acc) 35%, transparent); }
    #wave .cutz { fill: url(#hatch); }
    #wave .cutb { fill: none; stroke: color-mix(in srgb, var(--ccut) 55%, transparent); stroke-dasharray: 3 3; }
    #wave .thr { stroke: var(--cthr); stroke-width: 1.3; stroke-dasharray: 6 4; }
    #wave .thrl { fill: var(--cthr); font-size: 10.5px; font-weight: 800; }
    #wave .fi { stroke: var(--cin); stroke-width: 2; fill: none; } #wave .fo { stroke: var(--cout); stroke-width: 2; fill: none; }
    #wave .empty { fill: var(--dim); font-size: 12.5px; font-weight: 700; text-anchor: middle; }
    #scards { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; }
    .card3.det { --c: var(--cthr); } .card3.sfin { --c: var(--cin); } .card3.sfout { --c: var(--cout); }
    .card3 header select { font-weight: 700; font-size: 11.5px; padding: 2px 4px; max-width: 130px; }
    .srow { display: flex; align-items: center; gap: 8px; }
    .srow .fl { width: 104px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .srow input[type=range] { flex: 1; min-width: 0; accent-color: var(--c); height: 16px; }
    .srow .num { width: 80px; padding: 2px 7px; }
    .srow .num input { font-size: 13px; }
    .card3 .num input.c2 { color: var(--c); }
    .note { color: var(--dim); font-size: 11px; line-height: 1.4; margin: 0; }
    .note.warn { color: var(--cthr); }
    .top > * { flex-shrink: 0; }
    @media (max-width: 1100px) {
      #presetsLabel { display: none; }
      #preset { min-width: 128px; max-width: 160px; }
      .top { gap: 6px; }
      body[data-tab="fades"] #help span { display: none; }
      body[data-tab="fades"] #help { padding: 0 6px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body data-tab="fades">
  <div class="top">
    <h1>Fades <small id="ver"></small></h1>
    <div class="tabs" id="tabs"><button id="tabF" data-tab="fades"><svg viewBox="0 0 15 11"><path d="M1 10C4 2 8 1 14 1"/></svg><span></span></button><button id="tabS" data-tab="strip"><svg viewBox="0 0 15 11"><path d="M1 5.5h3M11 5.5h3"/><path d="M6 1v9M9 1v9" stroke-dasharray="1.5 2"/></svg><span></span><b class="new" id="tabNew"></b></button></div>
    <span class="lbl fOnly" id="presetsLabel"></span>
    <select id="preset" class="fOnly"></select>
    <span class="savebox fOnly" id="saveBox" hidden><input type="text" id="saveName" spellcheck="false" autocomplete="off"><button class="btn mainsm" id="saveOk"></button><button class="btn" id="saveCancel"></button></span>
    <button class="btn fOnly" id="compare"></button>
    <span class="grow"></span>
    <button id="help"></button>
    <div class="colors">
      <button id="colorBtn" aria-haspopup="true"><i></i></button>
      <div class="menu" id="colorMenu" hidden></div>
    </div>
    <div class="theme">
      <button data-t="dark" id="tDark"><svg viewBox="0 0 16 16"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg></button>
      <button data-t="grey" id="tGrey"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
    </div>
    <select id="lang"></select>
  </div>
  <main>
    <div class="tbar fOnly" id="tbar"><span class="tic"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span><div class="who"><b id="tMain"></b><span id="tSub"></span></div>
      <div class="sum"><span class="pill fin" id="pFin"><i></i><b>0</b><em></em></span><span class="pill xf" id="pXf"><i></i><b>0</b><em></em></span><span class="pill fout" id="pFout"><i></i><b>0</b><em></em></span></div></div>
    <div class="stripbox fOnly"><svg id="strip" preserveAspectRatio="none"></svg></div>
    <div class="mode fOnly"><span class="lbl" id="modeLabel"></span><div class="seg" id="mode"></div><button class="link" id="perType"></button></div>
    <div id="cards" class="fOnly"></div>
    <div class="tbar sOnly" id="sbar"><span class="tic"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span><div class="who"><b id="sMain"></b><span id="sSub"></span></div>
      <div class="sum"><span class="pill cut" id="pSil"><i></i><b>0</b><em></em></span><span class="pill fin" id="pSin"><i></i><b>0</b><em></em></span><span class="pill fout" id="pSout"><i></i><b>0</b><em></em></span></div></div>
    <div class="wavebox sOnly" id="wavebox"><div class="whead"><select id="sTrack"></select><span class="fl" id="sView"></span><span class="grow"></span><span class="lg" id="sLegend"></span></div><svg id="wave" preserveAspectRatio="none"></svg></div>
    <div id="scards" class="sOnly"></div>
  </main>
  <div class="foot">
    <span class="rule fOnly" id="rule"></span><span class="rule sOnly" id="sRule"></span>
    <span class="grow"></span>
    <span class="status" id="status" role="status"></span>
    <button class="btn" id="undo"></button>
    <button class="btn fOnly" id="remove"></button>
    <button class="btn main fOnly" id="apply"></button>
    <button class="btn main sOnly" id="sApply"></button>
  </div>
  <script src="vendor/luna.global.js"></script>
  <script src="copy.js"></script>
  <script src="winfit.js"></script>
  <script src="tour.js"></script>
  <script src="strip.js"></script>
  <script src="main.js"></script>
</body>
</html>
